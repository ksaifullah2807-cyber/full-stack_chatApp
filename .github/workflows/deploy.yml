name: Deploy ChatApp to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH username
        run: |
          echo "Username length: ${#USERNAME}"
          printf '%s' "$USERNAME" | od -An -t x1
        env:
          USERNAME: ${{ secrets.EC2_USERNAME }}

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > /tmp/chatapp-key.pem
          chmod 600 /tmp/chatapp-key.pem

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key_path: /tmp/chatapp-key.pem
          debug: true
          script: |
            cd ~/full-stack_chatApp
            git pull origin main
            docker compose up -d --build
            docker image prune -f
