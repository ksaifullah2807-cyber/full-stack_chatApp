name: Deploy ChatApp to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH username
        run: |
          echo "Username length: ${#USERNAME}"
          printf '%s' "$USERNAME" | od -An -t x1
        env:
          USERNAME: ${{ secrets.EC2_USERNAME }}

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > /tmp/chatapp-key.pem
          chmod 600 /tmp/chatapp-key.pem

      - name: Test SSH connection
        run: |
          ssh -vvv \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i /tmp/chatapp-key.pem \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "echo SSH_SUCCESS"
